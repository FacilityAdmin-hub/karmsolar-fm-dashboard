<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KarmSolar FM & Admin — Ticket Board</title>
<style>
  :root{
    --navy:#0f2a3d; --green:#1b7a4a; --green-dark:#145c38;
    --bg:#f4f7f6; --card:#ffffff; --border:#e1e6e5; --text:#1c2b28; --muted:#66756f;
    --danger:#c0392b; --warn:#c6820f; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);}
  header{background:linear-gradient(135deg,var(--navy),var(--green-dark));color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .headerLeft{display:flex;align-items:center;gap:14px;}
  .logoChip{display:inline-flex;align-items:center;background:#fff;border-radius:8px;padding:5px 12px;box-shadow:0 2px 6px rgba(0,0,0,.15);flex-shrink:0;}
  .logoChip img{display:block;height:24px;width:auto;}
  header h1{margin:0;font-size:1.3rem;}
  .topbar-right{font-size:.8rem;opacity:.85;}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 24px;background:#fff;border-bottom:1px solid var(--border);}
  .toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;}
  .toolbar .grow{flex:1;min-width:160px;}
  .viewToggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-left:auto;}
  .viewToggle button{border:none;background:#fff;padding:8px 16px;font-size:.82rem;font-weight:bold;color:var(--muted);cursor:pointer;}
  .viewToggle button.active{background:var(--green);color:#fff;}
  main{padding:20px 24px 60px;}

  table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 10px rgba(15,42,61,.05);}
  th,td{padding:10px 12px;text-align:left;font-size:.82rem;border-bottom:1px solid var(--border);vertical-align:top;}
  th{background:var(--navy);color:#fff;position:sticky;top:0;}
  tr:hover td{background:#f7faf9;}
  .pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:.72rem;font-weight:bold;color:#fff;}
  .pri-Low{background:#8aa6a0;} .pri-Medium{background:var(--warn);} .pri-High{background:#d97b2b;} .pri-Urgent{background:var(--danger);}
  .status-pill{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.72rem;font-weight:bold;color:#fff;background:var(--muted);white-space:nowrap;}
  .status-Backlog{background:#8a8f98;}
  .status-Open{background:#8aa6a0;}
  .status-InProgress{background:#2b6ea3;}
  .status-InReview{background:#6a4c9c;}
  .status-WaitingApproval{background:var(--warn);}
  .status-Blocked{background:var(--danger);}
  .status-Resolved{background:var(--green);}
  .status-Closed{background:#555;}

  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;}
  .col{flex:0 0 280px;background:#eef2f1;border-radius:var(--radius);padding:10px;}
  .col h3{margin:4px 6px 10px;font-size:.85rem;color:var(--navy);display:flex;justify-content:space-between;}
  .cardT{background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(15,42,61,.08);border-left:4px solid var(--green);}
  .cardT.pri-High,.cardT.pri-Urgent{border-left-color:var(--danger);}
  .cardT.pri-Medium{border-left-color:var(--warn);}
  .cardT h4{margin:0 0 4px;font-size:.86rem;}
  .cardT .meta{font-size:.72rem;color:var(--muted);margin-bottom:6px;}
  .cardT .cardActions{margin-top:6px;text-align:right;}

  .empty{text-align:center;color:var(--muted);padding:60px 20px;}

  .deleteBtn{border:1px solid var(--danger);background:#fff;color:var(--danger);border-radius:6px;padding:4px 9px;font-size:.72rem;font-weight:bold;cursor:pointer;}
  .deleteBtn:hover:not(:disabled){background:var(--danger);color:#fff;}
  .deleteBtn:disabled{opacity:.5;cursor:default;}

  .statusSelect{appearance:none;-webkit-appearance:none;border:none;border-radius:12px;padding:4px 22px 4px 10px;font-size:.72rem;font-weight:bold;color:#fff;cursor:pointer;background-color:var(--muted);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='white'><path d='M5.5 7.5l4.5 4.5 4.5-4.5z'/></svg>");background-repeat:no-repeat;background-position:right 6px center;background-size:12px;}
  .statusSelect:disabled{opacity:.6;cursor:default;}
  .statusSelect.status-Backlog{background-color:#8a8f98;}
  .statusSelect.status-Open{background-color:#8aa6a0;}
  .statusSelect.status-InProgress{background-color:#2b6ea3;}
  .statusSelect.status-InReview{background-color:#6a4c9c;}
  .statusSelect.status-WaitingApproval{background-color:var(--warn);}
  .statusSelect.status-Blocked{background-color:var(--danger);}
  .statusSelect.status-Resolved{background-color:var(--green);}
  .statusSelect.status-Closed{background-color:#555;}
  .statusSelect option{color:#000;background:#fff;font-weight:normal;}

  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:.85rem;box-shadow:0 4px 16px rgba(0,0,0,.2);display:none;z-index:50;}

  .modalOverlay{display:none;position:fixed;inset:0;background:rgba(15,42,61,.55);z-index:100;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
  .modalOverlay.open{display:flex;}
  .modalPanel{background:#fff;border-radius:12px;max-width:720px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modalHeader{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px;border-bottom:1px solid var(--border);}
  .modalHeader h2{margin:0 0 4px;font-size:1.15rem;color:var(--navy);}
  .modalHeader .modalId{font-size:.78rem;color:var(--muted);}
  .modalClose{border:none;background:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px;}
  .modalBody{padding:20px 24px;max-height:70vh;overflow-y:auto;}
  .detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:18px;font-size:.85rem;}
  .detailGrid .full{grid-column:1 / -1;}
  .detailGrid label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:2px;}
  .detailGrid .val{color:var(--text);}
  .modalSection{margin-top:20px;border-top:1px solid var(--border);padding-top:16px;}
  .modalSection h3{margin:0 0 10px;font-size:.9rem;color:var(--navy);}
  .commentItem{background:#f7faf9;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:.82rem;}
  .commentItem .commentMeta{color:var(--muted);font-size:.72rem;margin-bottom:4px;}
  .commentItem a{color:var(--green-dark);}
  .commentForm{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .commentForm input[type=text],.commentForm textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;font-family:inherit;}
  .commentForm textarea{min-height:60px;resize:vertical;}
  .commentForm .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .btnGreen{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:.82rem;font-weight:bold;cursor:pointer;}
  .btnGreen:hover:not(:disabled){background:var(--green-dark);}
  .btnGreen:disabled{opacity:.6;cursor:default;}
  .clickableRow{cursor:pointer;}
  .clickableCard{cursor:pointer;}
</style>
</head>
<body>

<header>
  <div class="headerLeft">
    <div class="logoChip"><img src="karm-logo.png" alt="Karm logo"></div>
    <h1>KarmSolar FM &amp; Admin — Ticket Board</h1>
  </div>
  <div class="topbar-right"><span id="syncLabel">Auto-synced · 9/1/2026, 7:33:20 PM UTC</span> · updates automatically every few minutes, no sign-in needed</div>
</header>

<div class="toolbar">
  <input type="text" id="searchBox" class="grow" placeholder="Search title, requester, site…">
  <select id="filterStatus"><option value="">All statuses</option></select>
  <select id="filterCategory"><option value="">All categories</option></select>
  <select id="filterPriority"><option value="">All priorities</option></select>
  <select id="sortBy">
    <option value="date_desc">Sort: Newest first</option>
    <option value="date_asc">Sort: Oldest first</option>
    <option value="priority_desc">Sort: Priority (High → Low)</option>
    <option value="priority_asc">Sort: Priority (Low → High)</option>
    <option value="status">Sort: Status (workflow order)</option>
    <option value="category">Sort: Category (A → Z)</option>
    <option value="id">Sort: Ticket ID</option>
  </select>
  <div class="viewToggle">
    <button id="tableViewBtn" class="active">Table</button>
    <button id="kanbanViewBtn">Kanban</button>
  </div>
</div>

<main>
  <div id="tableView"></div>
  <div id="kanbanView" style="display:none;"></div>
</main>

<div id="toast"></div>

<div class="modalOverlay" id="modalOverlay">
  <div class="modalPanel">
    <div class="modalHeader">
      <div>
        <h2 id="modalTitle"></h2>
        <div class="modalId" id="modalTicketId"></div>
      </div>
      <button class="modalClose" id="modalCloseBtn">&times;</button>
    </div>
    <div class="modalBody" id="modalBody"></div>
  </div>
</div>

<script>
// No secret lives in this file. Deletes go through the same small serverless
// proxy (Cloudflare Worker) the submission form uses — it privately holds the
// real GitHub token and opens a "Delete: <id>" issue on this page's behalf.
const PROXY_URL = "https://karmsolar-ticket-proxy.mohi-mohsen.workers.dev/";

// Baked in fresh every ~5 minutes by .github/workflows/ticket-sync.yml — this page
// never talks to Microsoft Graph itself, so it needs no sign-in for anyone viewing it.
const EMBEDDED_TICKETS = [];
const EMBEDDED_COMMENTS = {"TCK-260825-103352-IMJ":[{"Ticket ID":"TCK-260825-103352-IMJ","Timestamp":"2026-09-01 10:41","Type":"Comment","Author":"Anonymous","Content":"End to end verification comment.","AttachmentURL":""},{"Ticket ID":"TCK-260825-103352-IMJ","Timestamp":"2026-09-01 11:32","Type":"Comment","Author":"Anonymous","Content":"Verifying email notification after Mail.Send consent.","AttachmentURL":""}]};

// Full JIRA-like workflow. Order here also drives "Sort: Status (workflow order)".
const STATUSES = ["Backlog","Open","In Progress","In Review","Waiting Approval","Blocked","Resolved","Closed"];
const PRIORITIES = ["Low","Medium","High","Urgent"];
let tickets = EMBEDDED_TICKETS;

// Comments/attachments grouped by Ticket ID, baked in by ticket-sync.yml from the
// "Comments" sheet in FM Tickets.xlsx. Mutable copy so new comments/attachments
// appear immediately without waiting for the next sync.
let commentsByTicket = JSON.parse(JSON.stringify(EMBEDDED_COMMENTS || {}));

function populateFilters(){
  const cats = [...new Set(tickets.map(t=>t['Category']).filter(Boolean))];
  const fc = document.getElementById('filterCategory');
  fc.innerHTML = '<option value="">All categories</option>' + cats.map(c=>`<option>${c}</option>`).join('');
  const fs = document.getElementById('filterStatus');
  fs.innerHTML = '<option value="">All statuses</option>' + STATUSES.map(s=>`<option>${s}</option>`).join('');
  const fp = document.getElementById('filterPriority');
  fp.innerHTML = '<option value="">All priorities</option>' + PRIORITIES.slice().reverse().map(p=>`<option>${p}</option>`).join('');
}

function getFiltered(){
  const q = document.getElementById('searchBox').value.toLowerCase();
  const st = document.getElementById('filterStatus').value;
  const cat = document.getElementById('filterCategory').value;
  const pri = document.getElementById('filterPriority').value;
  const list = tickets.filter(t=>{
    if (st && t['Status'] !== st) return false;
    if (cat && t['Category'] !== cat) return false;
    if (pri && t['Priority'] !== pri) return false;
    if (q){
      const hay = (t['Title']+' '+t['Requester Name']+' '+t['Site / Location']+' '+t['Ticket ID']).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  return sortList(list, document.getElementById('sortBy').value);
}

function sortList(list, mode){
  const out = list.slice();
  const byDate = (t) => t['Date Submitted'] || '';
  const priRank = (t) => { const i = PRIORITIES.indexOf(t['Priority']); return i < 0 ? -1 : i; };
  const statusRank = (t) => { const i = STATUSES.indexOf(t['Status']); return i < 0 ? STATUSES.length : i; };
  switch(mode){
    case 'date_asc': out.sort((a,b)=>byDate(a).localeCompare(byDate(b))); break;
    case 'priority_desc': out.sort((a,b)=>priRank(b)-priRank(a)); break;
    case 'priority_asc': out.sort((a,b)=>priRank(a)-priRank(b)); break;
    case 'status': out.sort((a,b)=>statusRank(a)-statusRank(b)); break;
    case 'category': out.sort((a,b)=>(a['Category']||'').localeCompare(b['Category']||'')); break;
    case 'id': out.sort((a,b)=>(a['Ticket ID']||'').localeCompare(b['Ticket ID']||'')); break;
    case 'date_desc':
    default: out.sort((a,b)=>byDate(b).localeCompare(byDate(a))); break;
  }
  return out;
}

function statusClass(s){ return 'status-' + String(s||'').replace(/\s+/g,''); }

function render(){
  const list = getFiltered();
  renderTable(list);
  renderKanban(list);
}

function renderTable(list){
  const el = document.getElementById('tableView');
  if (!list.length){ el.innerHTML = '<div class="empty">No tickets match your filters.</div>'; return; }
  el.innerHTML = `<table><thead><tr>
    <th>ID</th><th>Submitted</th><th>Title</th><th>Category</th><th>Priority</th><th>Site</th><th>Requester</th><th>Status</th><th>Assigned To</th><th>Actions</th>
  </tr></thead><tbody>${list.map(t=>{
    const id = escapeHtml(t['Ticket ID']);
    return `<tr class="clickableRow" data-open-id="${id}">
      <td>${id}</td>
      <td>${escapeHtml(t['Date Submitted'])}</td>
      <td><b>${escapeHtml(t['Title'])}</b><div style="color:var(--muted);font-size:.75rem;margin-top:2px;">${escapeHtml((t['Description']||'').slice(0,80))}</div></td>
      <td>${escapeHtml(t['Category'])}</td>
      <td><span class="pill pri-${t['Priority']}">${escapeHtml(t['Priority'])}</span></td>
      <td>${escapeHtml(t['Site / Location'])}</td>
      <td>${escapeHtml(t['Requester Name'])}<div style="color:var(--muted);font-size:.72rem;">${escapeHtml(t['Requester Email'])}</div></td>
      <td>${statusSelectHtml(t)}</td>
      <td>${escapeHtml(t['Assigned To'])}</td>
      <td><button class="deleteBtn" data-id="${id}" data-title="${escapeHtml(t['Title'])}">Delete</button></td>
    </tr>`;
  }).join('')}</tbody></table>`;
  el.querySelectorAll('.deleteBtn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); deleteTicket(btn.dataset.id, btn.dataset.title, btn); });
  });
  el.querySelectorAll('.statusSelect').forEach(sel=>{
    sel.addEventListener('click', e=>e.stopPropagation());
    sel.addEventListener('change', ()=>updateStatus(sel.dataset.id, sel.value, sel));
  });
  el.querySelectorAll('.clickableRow').forEach(row=>{
    row.addEventListener('click', ()=>openModal(row.dataset.openId));
  });
}

function statusSelectHtml(t){
  const id = escapeHtml(t['Ticket ID']);
  const current = t['Status'] || '';
  const opts = STATUSES.map(s=>`<option value="${s}" ${s===current?'selected':''}>${s}</option>`).join('');
  return `<select class="statusSelect ${statusClass(current)}" data-id="${id}">${opts}</select>`;
}

function renderKanban(list){
  const el = document.getElementById('kanbanView');
  el.innerHTML = `<div class="board">${STATUSES.map(s=>{
    const items = list.filter(t=>t['Status']===s);
    return `<div class="col"><h3>${s} <span>${items.length}</span></h3>${items.map(t=>{
      const id = escapeHtml(t['Ticket ID']);
      return `<div class="cardT pri-${t['Priority']} clickableCard" data-open-id="${id}">
        <h4>${escapeHtml(t['Title'])}</h4>
        <div class="meta">${id} · ${escapeHtml(t['Category'])} · ${escapeHtml(t['Site / Location'])}<br>${escapeHtml(t['Requester Name'])}</div>
        <div class="cardActions">${statusSelectHtml(t)} <button class="deleteBtn" data-id="${id}" data-title="${escapeHtml(t['Title'])}">Delete</button></div>
      </div>`;
    }).join('') || '<div style="color:var(--muted);font-size:.78rem;padding:8px;">Empty</div>'}</div>`;
  }).join('')}</div>`;
  el.querySelectorAll('.deleteBtn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); deleteTicket(btn.dataset.id, btn.dataset.title, btn); });
  });
  el.querySelectorAll('.statusSelect').forEach(sel=>{
    sel.addEventListener('click', e=>e.stopPropagation());
    sel.addEventListener('change', ()=>updateStatus(sel.dataset.id, sel.value, sel));
  });
  el.querySelectorAll('.clickableCard').forEach(card=>{
    card.addEventListener('click', ()=>openModal(card.dataset.openId));
  });
}

function escapeHtml(s){ return (s==null?'':s).toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>{ t.style.display = 'none'; }, 4000);
}

async function deleteTicket(id, title, btn){
  if (!confirm(`Delete ticket ${id} — "${title}"?\n\nThis can't be undone.`)) return;
  const allBtns = document.querySelectorAll(`.deleteBtn[data-id="${CSS.escape(id)}"]`);
  allBtns.forEach(b=>{ b.disabled = true; b.textContent = '…'; });
  try{
    const res = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'delete', ticketId: id })
    });
    if (!res.ok){ throw new Error(await res.text()); }
    tickets = tickets.filter(t => t['Ticket ID'] !== id);
    populateFilters();
    render();
    showToast(`${id} removed. Excel + full board sync in progress (usually under a minute).`);
  }catch(err){
    console.error(err);
    alert('Delete failed: ' + err.message);
    allBtns.forEach(b=>{ b.disabled = false; b.textContent = 'Delete'; });
  }
}

async function updateStatus(id, newStatus, selectEl){
  const previous = tickets.find(t => t['Ticket ID'] === id);
  const previousStatus = previous ? previous['Status'] : null;
  const allSelects = document.querySelectorAll(`.statusSelect[data-id="${CSS.escape(id)}"]`);
  allSelects.forEach(s=>{ s.disabled = true; });
  try{
    const res = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'update-status', ticketId: id, status: newStatus })
    });
    if (!res.ok){ throw new Error(await res.text()); }
    if (previous) previous['Status'] = newStatus;
    populateFilters();
    render();
    showToast(`${id} → ${newStatus}. Excel + full board sync in progress (usually under a minute). The requester will get an email too.`);
    if (modalOpenId === id) renderModal(id);
  }catch(err){
    console.error(err);
    alert('Status update failed: ' + err.message);
    if (selectEl && previousStatus != null) selectEl.value = previousStatus;
    allSelects.forEach(s=>{ s.disabled = false; });
  }
}

// ---- Ticket detail modal: full fields + comments/attachments thread ----

let modalOpenId = null;

function getYourName(){
  return localStorage.getItem('fm_commenter_name') || '';
}
function setYourName(name){
  try{ localStorage.setItem('fm_commenter_name', name); }catch(e){}
}

function openModal(id){
  modalOpenId = id;
  renderModal(id);
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(){
  modalOpenId = null;
  document.getElementById('modalOverlay').classList.remove('open');
}

function renderModal(id){
  const t = tickets.find(x => x['Ticket ID'] === id);
  if (!t){ closeModal(); return; }
  document.getElementById('modalTitle').textContent = t['Title'] || '(untitled)';
  document.getElementById('modalTicketId').textContent = id;

  const fieldsHtml = `
    <div class="detailGrid">
      <div><label>Status</label><div class="val">${statusSelectHtml(t)}</div></div>
      <div><label>Priority</label><div class="val"><span class="pill pri-${t['Priority']}">${escapeHtml(t['Priority'])}</span></div></div>
      <div><label>Category</label><div class="val">${escapeHtml(t['Category'])}</div></div>
      <div><label>Site / Location</label><div class="val">${escapeHtml(t['Site / Location'])}</div></div>
      <div><label>Requester</label><div class="val">${escapeHtml(t['Requester Name'])}<br>${escapeHtml(t['Requester Email'])}</div></div>
      <div><label>Assigned To</label><div class="val">${escapeHtml(t['Assigned To']) || '—'}</div></div>
      <div><label>Date Submitted</label><div class="val">${escapeHtml(t['Date Submitted'])}</div></div>
      <div><label>Date Updated</label><div class="val">${escapeHtml(t['Date Updated']) || '—'}</div></div>
      <div class="full"><label>Description</label><div class="val">${escapeHtml(t['Description']).replace(/\n/g,'<br>')}</div></div>
      ${t['Resolution Notes'] ? `<div class="full"><label>Resolution Notes</label><div class="val">${escapeHtml(t['Resolution Notes']).replace(/\n/g,'<br>')}</div></div>` : ''}
    </div>`;

  const items = (commentsByTicket[id] || []);
  const commentsHtml = items.length ? items.map(c=>{
    if (c['Type'] === 'Attachment'){
      return `<div class="commentItem"><div class="commentMeta">${escapeHtml(c['Author'])} · ${escapeHtml(c['Timestamp'])} · attached a file</div>📎 <a href="${escapeHtml(c['AttachmentURL'])}" target="_blank" rel="noopener">${escapeHtml(c['Content'])}</a></div>`;
    }
    return `<div class="commentItem"><div class="commentMeta">${escapeHtml(c['Author'])} · ${escapeHtml(c['Timestamp'])}</div>${escapeHtml(c['Content']).replace(/\n/g,'<br>')}</div>`;
  }).join('') : '<div style="color:var(--muted);font-size:.82rem;">No comments or attachments yet.</div>';

  document.getElementById('modalBody').innerHTML = `
    ${fieldsHtml}
    <div class="modalSection">
      <h3>Activity</h3>
      <div id="commentList">${commentsHtml}</div>
      <div class="commentForm">
        <input type="text" id="commenterName" placeholder="Your name" value="${escapeHtml(getYourName())}">
        <textarea id="commentText" placeholder="Add a comment for the requester..."></textarea>
        <div class="row">
          <button class="btnGreen" id="submitCommentBtn">Post comment</button>
          <label class="btnGreen" style="background:var(--muted);cursor:pointer;">
            Attach file <input type="file" id="attachmentInput" style="display:none;">
          </label>
          <span id="attachmentFileName" style="font-size:.78rem;color:var(--muted);"></span>
        </div>
      </div>
    </div>`;

  document.querySelectorAll('#modalBody .statusSelect').forEach(sel=>{
    sel.addEventListener('change', ()=>updateStatus(sel.dataset.id, sel.value, sel));
  });
  document.getElementById('submitCommentBtn').addEventListener('click', ()=>submitComment(id));
  document.getElementById('attachmentInput').addEventListener('change', (e)=>{
    const f = e.target.files[0];
    document.getElementById('attachmentFileName').textContent = f ? f.name : '';
    if (f) submitAttachment(id, f);
  });
}

async function submitComment(id){
  const nameEl = document.getElementById('commenterName');
  const textEl = document.getElementById('commentText');
  const author = (nameEl.value || 'Anonymous').trim();
  const comment = textEl.value.trim();
  if (!comment) return;
  setYourName(author);
  const btn = document.getElementById('submitCommentBtn');
  btn.disabled = true; btn.textContent = 'Posting…';
  try{
    const res = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'add-comment', ticketId: id, author, comment })
    });
    if (!res.ok){ throw new Error(await res.text()); }
    if (!commentsByTicket[id]) commentsByTicket[id] = [];
    commentsByTicket[id].push({ 'Ticket ID': id, Timestamp: 'just now', Type: 'Comment', Author: author, Content: comment, AttachmentURL: '' });
    textEl.value = '';
    renderModal(id);
    showToast('Comment posted — the requester has been emailed.');
  }catch(err){
    console.error(err);
    alert('Could not post comment: ' + err.message);
    btn.disabled = false; btn.textContent = 'Post comment';
  }
}

function readFileAsBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result; // "data:<type>;base64,<data>"
      const base64 = String(result).split(',')[1] || '';
      resolve(base64);
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

async function submitAttachment(id, file){
  const nameEl = document.getElementById('commenterName');
  const author = (nameEl.value || 'Anonymous').trim();
  setYourName(author);
  const nameLabel = document.getElementById('attachmentFileName');
  nameLabel.textContent = `Uploading ${file.name}…`;
  try{
    const dataBase64 = await readFileAsBase64(file);
    const res = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'add-attachment', ticketId: id, author, filename: file.name, contentType: file.type || 'application/octet-stream', dataBase64 })
    });
    if (!res.ok){ throw new Error(await res.text()); }
    const data = await res.json().catch(()=>({}));
    if (!commentsByTicket[id]) commentsByTicket[id] = [];
    commentsByTicket[id].push({ 'Ticket ID': id, Timestamp: 'just now', Type: 'Attachment', Author: author, Content: file.name, AttachmentURL: data.url || '#' });
    renderModal(id);
    showToast('Attachment uploaded — the requester has been emailed.');
  }catch(err){
    console.error(err);
    alert('Could not upload attachment: ' + err.message);
    nameLabel.textContent = '';
  }
}

document.getElementById('modalOverlay').addEventListener('click', (e)=>{

populateFilters();
