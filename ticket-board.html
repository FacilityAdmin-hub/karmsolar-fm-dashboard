<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KarmSolar FM & Admin — Ticket Board</title>
<style>
  :root{
    --navy:#0f2a3d; --green:#1b7a4a; --green-dark:#145c38;
    --bg:#f4f7f6; --card:#ffffff; --border:#e1e6e5; --text:#1c2b28; --muted:#66756f;
    --danger:#c0392b; --warn:#c6820f; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);}
  header{background:linear-gradient(135deg,var(--navy),var(--green-dark));color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  header h1{margin:0;font-size:1.3rem;}
  .topbar-right{font-size:.8rem;opacity:.85;}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 24px;background:#fff;border-bottom:1px solid var(--border);}
  .toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;}
  .toolbar .grow{flex:1;min-width:160px;}
  .viewToggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-left:auto;}
  .viewToggle button{border:none;background:#fff;padding:8px 16px;font-size:.82rem;font-weight:bold;color:var(--muted);cursor:pointer;}
  .viewToggle button.active{background:var(--green);color:#fff;}
  main{padding:20px 24px 60px;}

  table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 10px rgba(15,42,61,.05);}
  th,td{padding:10px 12px;text-align:left;font-size:.82rem;border-bottom:1px solid var(--border);vertical-align:top;}
  th{background:var(--navy);color:#fff;position:sticky;top:0;}
  tr:hover td{background:#f7faf9;}
  .pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:.72rem;font-weight:bold;color:#fff;}
  .pri-Low{background:#8aa6a0;} .pri-Medium{background:var(--warn);} .pri-High{background:#d97b2b;} .pri-Urgent{background:var(--danger);}
  .status-pill{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.72rem;font-weight:bold;color:#fff;background:var(--muted);}
  .status-Open{background:#8aa6a0;} .status-InProgress{background:#2b6ea3;} .status-OnHold{background:var(--warn);}
  .status-Resolved{background:var(--green);} .status-Closed{background:#555;}

  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;}
  .col{flex:0 0 280px;background:#eef2f1;border-radius:var(--radius);padding:10px;}
  .col h3{margin:4px 6px 10px;font-size:.85rem;color:var(--navy);display:flex;justify-content:space-between;}
  .cardT{background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(15,42,61,.08);border-left:4px solid var(--green);}
  .cardT.pri-High,.cardT.pri-Urgent{border-left-color:var(--danger);}
  .cardT.pri-Medium{border-left-color:var(--warn);}
  .cardT h4{margin:0 0 4px;font-size:.86rem;}
  .cardT .meta{font-size:.72rem;color:var(--muted);margin-bottom:6px;}

  .empty{text-align:center;color:var(--muted);padding:60px 20px;}
</style>
</head>
<body>

<header>
  <h1>KarmSolar FM &amp; Admin — Ticket Board</h1>
  <div class="topbar-right"><span id="syncLabel">Auto-synced · 8/30/2026, 5:09:04 PM UTC</span> · updates automatically every few minutes, no sign-in needed</div>
</header>

<div class="toolbar">
  <input type="text" id="searchBox" class="grow" placeholder="Search title, requester, site…">
  <select id="filterStatus"><option value="">All statuses</option></select>
  <select id="filterCategory"><option value="">All categories</option></select>
  <select id="filterPriority"><option value="">All priorities</option></select>
  <div class="viewToggle">
    <button id="tableViewBtn" class="active">Table</button>
    <button id="kanbanViewBtn">Kanban</button>
  </div>
</div>

<main>
  <div id="tableView"></div>
  <div id="kanbanView" style="display:none;"></div>
</main>

<script>
// Baked in fresh every ~5 minutes by .github/workflows/ticket-sync.yml — this page
// never talks to Microsoft Graph itself, so it needs no sign-in for anyone viewing it.
const EMBEDDED_TICKETS = [{"Ticket ID":"TCK-260825-103352-IMJ","Date Submitted":"2026-08-25 07:33","Title":"TEST","Description":"TEST","Category":"IT / Equipment","Priority":"Medium","Site / Location":"TEST","Requester Name":"teat ","Requester Email":"mohi.mohsen@karmsolar.com","Status":"Open","Assigned To":"","Date Updated":"","Resolution Notes":""},{"Ticket ID":"TCK-260826-091433-H7Y","Date Submitted":"2026-08-26 09:14","Title":"End-to-end pipeline test","Description":"Testing the Issue-Action-Excel pipeline.","Category":"Other","Priority":"Low","Site / Location":"HQ","Requester Name":"Pipeline Test","Requester Email":"test@karmsolar.com","Status":"Open","Assigned To":"","Date Updated":"","Resolution Notes":""},{"Ticket ID":"TCK-260830-094613-YU3","Date Submitted":"2026-08-30 09:46","Title":"test","Description":"verifying token before embedding","Category":"Other","Priority":"Low","Site / Location":"HQ","Requester Name":"Pre-check","Requester Email":"precheck@karmsolar.com","Status":"Open","Assigned To":"","Date Updated":"","Resolution Notes":""},{"Ticket ID":"TCK-260830-123943-ZJG","Date Submitted":"2026-08-30 12:39","Title":"final-token-verify","Description":"testing after replacing the secret with a fresh unused token","Category":"Other","Priority":"Low","Site / Location":"HQ","Requester Name":"Final Verify","Requester Email":"finalverify@karmsolar.com","Status":"Open","Assigned To":"","Date Updated":"","Resolution Notes":""}];

const STATUSES = ["Open","In Progress","On Hold","Resolved","Closed"];
let tickets = EMBEDDED_TICKETS;

function populateFilters(){
  const cats = [...new Set(tickets.map(t=>t['Category']).filter(Boolean))];
  const fc = document.getElementById('filterCategory');
  fc.innerHTML = '<option value="">All categories</option>' + cats.map(c=>`<option>${c}</option>`).join('');
  const fs = document.getElementById('filterStatus');
  fs.innerHTML = '<option value="">All statuses</option>' + STATUSES.map(s=>`<option>${s}</option>`).join('');
}

function getFiltered(){
  const q = document.getElementById('searchBox').value.toLowerCase();
  const st = document.getElementById('filterStatus').value;
  const cat = document.getElementById('filterCategory').value;
  const pri = document.getElementById('filterPriority').value;
  return tickets.filter(t=>{
    if (st && t['Status'] !== st) return false;
    if (cat && t['Category'] !== cat) return false;
    if (pri && t['Priority'] !== pri) return false;
    if (q){
      const hay = (t['Title']+' '+t['Requester Name']+' '+t['Site / Location']+' '+t['Ticket ID']).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function statusClass(s){ return 'status-' + String(s||'').replace(/\s+/g,''); }

function render(){
  const list = getFiltered();
  renderTable(list);
  renderKanban(list);
}

function renderTable(list){
  const el = document.getElementById('tableView');
  if (!list.length){ el.innerHTML = '<div class="empty">No tickets match your filters.</div>'; return; }
  el.innerHTML = `<table><thead><tr>
    <th>ID</th><th>Submitted</th><th>Title</th><th>Category</th><th>Priority</th><th>Site</th><th>Requester</th><th>Status</th><th>Assigned To</th>
  </tr></thead><tbody>${list.map(t=>{
    return `<tr>
      <td>${escapeHtml(t['Ticket ID'])}</td>
      <td>${escapeHtml(t['Date Submitted'])}</td>
      <td><b>${escapeHtml(t['Title'])}</b><div style="color:var(--muted);font-size:.75rem;margin-top:2px;">${escapeHtml((t['Description']||'').slice(0,80))}</div></td>
      <td>${escapeHtml(t['Category'])}</td>
      <td><span class="pill pri-${t['Priority']}">${escapeHtml(t['Priority'])}</span></td>
      <td>${escapeHtml(t['Site / Location'])}</td>
      <td>${escapeHtml(t['Requester Name'])}<div style="color:var(--muted);font-size:.72rem;">${escapeHtml(t['Requester Email'])}</div></td>
      <td><span class="status-pill ${statusClass(t['Status'])}">${escapeHtml(t['Status'])}</span></td>
      <td>${escapeHtml(t['Assigned To'])}</td>
    </tr>`;
  }).join('')}</tbody></table>`;
}

function renderKanban(list){
  const el = document.getElementById('kanbanView');
  el.innerHTML = `<div class="board">${STATUSES.map(s=>{
    const items = list.filter(t=>t['Status']===s);
    return `<div class="col"><h3>${s} <span>${items.length}</span></h3>${items.map(t=>{
      return `<div class="cardT pri-${t['Priority']}">
        <h4>${escapeHtml(t['Title'])}</h4>
        <div class="meta">${escapeHtml(t['Ticket ID'])} · ${escapeHtml(t['Category'])} · ${escapeHtml(t['Site / Location'])}<br>${escapeHtml(t['Requester Name'])}</div>
      </div>`;
    }).join('') || '<div style="color:var(--muted);font-size:.78rem;padding:8px;">Empty</div>'}</div>`;
  }).join('')}</div>`;
}

function escapeHtml(s){ return (s==null?'':s).toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

['searchBox'].forEach(id=>document.getElementById(id).addEventListener('input', render));
['filterStatus','filterCategory','filterPriority'].forEach(id=>document.getElementById(id).addEventListener('change', render));

document.getElementById('tableViewBtn').addEventListener('click', ()=>{
  document.getElementById('tableView').style.display='block';
  document.getElementById('kanbanView').style.display='none';
  document.getElementById('tableViewBtn').classList.add('active');
  document.getElementById('kanbanViewBtn').classList.remove('active');
});
document.getElementById('kanbanViewBtn').addEventListener('click', ()=>{
  document.getElementById('tableView').style.display='none';
  document.getElementById('kanbanView').style.display='block';
  document.getElementById('kanbanViewBtn').classList.add('active');
  document.getElementById('tableViewBtn').classList.remove('active');
});

populateFilters();
render();
</script>
</body>
</html>
